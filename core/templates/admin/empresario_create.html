{% extends 'base.html' %}
{% block title %}Crear Empresario{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center">
    <h2>Crear Nuevo Empresario</h2>
    <a href="{% url 'dashboard' %}" class="btn btn-secondary">Volver</a>
</div>

<div class="row mt-4">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5>Información del Empresario</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <label>Documento (Usuario):</label>
                        <input type="text" name="documento" class="form-control" required>
                    </div>
                    <div class="form-group mt-3">
                        <label>Nombres:</label>
                        <input type="text" name="nombres" class="form-control" required>
                    </div>
                    <div class="form-group mt-3">
                        <label>Apellidos:</label>
                        <input type="text" name="apellidos" class="form-control" required>
                    </div>
                    <div class="form-group mt-3">
                        <label>Email:</label>
                        <input type="email" name="email" class="form-control">
                    </div>
                    <div class="form-group mt-3">
                        <label>Teléfono:</label>
                        <input type="text" name="telefono" class="form-control" required>
                    </div>
                    <div class="form-group mt-3">
                        <label>Teléfono Familiar:</label>
                        <input type="text" name="telefono_familiar" class="form-control" required>
                    </div>
                    <div class="form-group mt-3">
                        <label>Dirección:</label>
                        <textarea name="direccion" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="form-group mt-3">
                        <label>Contraseña:</label>
                        <input type="text" name="password" class="form-control" required>
                    </div>
                    <div class="form-group mt-3">
                        <label>Límite de Operarios:</label>
                        <input type="number" name="limite_chanceros" class="form-control" value="10" required>
                    </div>
                    <div class="form-group mt-3">
                        <label>Comisión del Admin (%):</label>
                        <input type="number" step="0.01" name="comision_admin_porcentaje" class="form-control" value="0">
                        <small class="form-text text-muted">Porcentaje que el administrador cobra sobre las ventas brutas de este empresario.</small>
                    </div>
                    <button type="submit" class="btn btn-primary mt-4">Crear Empresario</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
