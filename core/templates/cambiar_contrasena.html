{% extends 'base.html' %}
{% block title %}Cambiar Contraseña{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5>Cambiar Contraseña</h5>
            </div>
            <div class="card-body">
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}
                {% if success %}
                <div class="alert alert-success">{{ success }}</div>
                {% endif %}
                
                <form method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <label>Contraseña Actual:</label>
                        <input type="password" name="contrasena_actual" class="form-control" required>
                    </div>
                    <div class="form-group mt-3">
                        <label>Nueva Contraseña:</label>
                        <input type="password" name="contrasena_nueva" class="form-control" required>
                    </div>
                    <div class="form-group mt-3">
                        <label>Confirmar Nueva Contraseña:</label>
                        <input type="password" name="contrasena_confirmar" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary mt-4">Cambiar Contraseña</button>
                    <a href="{% url 'dashboard' %}" class="btn btn-secondary mt-4">Cancelar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
