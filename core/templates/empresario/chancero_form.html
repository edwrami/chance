{% extends 'base.html' %}
{% block title %}Crear Chancero{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center">
    <h2>Crear Chancero</h2>
    <div>
        <a href="{% url 'dashboard' %}" class="btn btn-secondary">Dashboard</a>
        <a href="{% url 'chanceros_list' %}" class="btn btn-secondary">Volver a Chanceros</a>
    </div>
</div>

<div class="row mt-4">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5>Información del Chancero</h5>
            </div>
            <div class="card-body">
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}
                <form method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <label>Documento:</label>
                        <input type="text" name="documento" class="form-control" required>
                    </div>
                    <div class="form-group mt-3">
                        <label>Nombres:</label>
                        <input type="text" name="nombres" class="form-control" required>
                    </div>
                    <div class="form-group mt-3">
                        <label>Apellidos:</label>
                        <input type="text" name="apellidos" class="form-control" required>
                    </div>
                    <div class="form-group mt-3">
                        <label>Teléfono:</label>
                        <input type="text" name="telefono" class="form-control" required>
                    </div>
                    <div class="form-group mt-3">
                        <label>Dirección:</label>
                        <input type="text" name="direccion" class="form-control" required>
                    </div>
                    <div class="form-group mt-3">
                        <label>Email (opcional):</label>
                        <input type="email" name="email" class="form-control">
                    </div>
                    <div class="form-group mt-3">
                        <label>Teléfono Familiar:</label>
                        <input type="text" name="telefono_familiar" class="form-control" required>
                    </div>
                    <div class="form-group mt-3">
                        <label>Contraseña:</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <div class="form-group mt-3">
                        <label>Confirmar Contraseña:</label>
                        <input type="password" name="password_confirm" class="form-control" required>
                    </div>
                    <div class="form-group mt-3">
                        <label>Comisión (%):</label>
                        <input type="number" name="comision" class="form-control" value="10" min="0" max="100" step="0.1">
                        <small class="text-muted">Porcentaje de comisión para el chancero</small>
                    </div>
                    <button type="submit" class="btn btn-primary mt-4">Crear Chancero</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
