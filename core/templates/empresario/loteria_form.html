{% extends 'base.html' %}
{% block title %}Crear Lotería{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center">
    <h2>Crear Lotería</h2>
    <div>
        <a href="{% url 'dashboard' %}" class="btn btn-secondary">Dashboard</a>
        <a href="{% url 'loterias_list' %}" class="btn btn-secondary">Volver a Loterías</a>
    </div>
</div>

<div class="row mt-4">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5>Información de la Lotería</h5>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <label>Nombre de la Lotería:</label>
                        <input type="text" name="nombre" class="form-control" required>
                    </div>
                    <div class="form-group mt-3">
                        <label>Días de la Semana:</label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="dias" value="Lunes" id="lunes">
                            <label class="form-check-label" for="lunes">Lunes</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="dias" value="Martes" id="martes">
                            <label class="form-check-label" for="martes">Martes</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="dias" value="Miércoles" id="miercoles">
                            <label class="form-check-label" for="miercoles">Miércoles</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="dias" value="Jueves" id="jueves">
                            <label class="form-check-label" for="jueves">Jueves</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="dias" value="Viernes" id="viernes">
                            <label class="form-check-label" for="viernes">Viernes</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="dias" value="Sábado" id="sabado">
                            <label class="form-check-label" for="sabado">Sábado</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="dias" value="Domingo" id="domingo">
                            <label class="form-check-label" for="domingo">Domingo</label>
                        </div>
                    </div>
                    <div class="form-group mt-3">
                        <label>Horario de Apertura:</label>
                        <input type="time" name="horario_apertura" class="form-control" required>
                    </div>
                    <div class="form-group mt-3">
                        <label>Horario de Cierre:</label>
                        <input type="time" name="horario_cierre" class="form-control" required>
                    </div>
                    <div class="form-group mt-3">
                        <label>Tope de Premio Máximo:</label>
                        <input type="number" name="tope_premio" class="form-control" required min="0">
                        <small class="text-muted">Monto máximo que se puede ganar en esta lotería</small>
                    </div>
                    <div class="form-group mt-3">
                        <label>
                            <input type="checkbox" name="activa" checked>
                            Lotería Activa
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary mt-4">Crear Lotería</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
